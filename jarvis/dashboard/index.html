<title>자비스 상황판</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: 모바일 우선 한 칸 세로 흐름. 위에서 아래로 요약 → 확인 필요 → 세션 → 예약 → 정리 → 개선 */
:root{--bg:#f3f5f7;--panel:#fff;--fg:#14202b;--muted:#5d6b78;--line:#dbe1e7;--accent:#1f5f8b;--ok:#1b7a4b;--warn:#a86400;--bad:#b3261e;--info:#1f5f8b;--chip:#e8edf2;
--font:Inter,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e141a;--panel:#17212a;--fg:#e6edf3;--muted:#94a3b0;--line:#2a3743;--accent:#6bb3e0;--ok:#4cc38a;--warn:#e0a53b;--bad:#ff7b72;--info:#6bb3e0;--chip:#223140;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e141a;--panel:#17212a;--fg:#e6edf3;--muted:#94a3b0;--line:#2a3743;--accent:#6bb3e0;--ok:#4cc38a;--warn:#e0a53b;--bad:#ff7b72;--info:#6bb3e0;--chip:#223140;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1{font-size:22px;margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:13px;margin:0 0 8px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;display:flex;gap:8px;align-items:center}
h2 .n{background:var(--chip);color:var(--fg);border-radius:10px;padding:0 8px;font-size:12px;letter-spacing:0}
.head p{margin:4px 0 0;font-size:16px;text-wrap:balance}
.meta{color:var(--muted);font-size:13px;margin-top:6px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px;margin-top:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0}
.tile b{display:block;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0;border-left:4px solid var(--line)}
.item.s-bad{border-left-color:var(--bad)}.item.s-warn{border-left-color:var(--warn)}.item.s-ok{border-left-color:var(--ok)}.item.s-info{border-left-color:var(--info)}
.row{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.t{font-weight:600;min-width:0;overflow-wrap:anywhere}
.d{color:var(--muted);font-size:13.5px;margin-top:2px;overflow-wrap:anywhere}
.pill{font-size:12px;border-radius:10px;padding:1px 8px;background:var(--chip);white-space:nowrap}
.pill.bad{color:var(--bad)}.pill.warn{color:var(--warn)}.pill.ok{color:var(--ok)}.pill.info{color:var(--info)}
.sub{font-size:12px;color:var(--muted);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-size:14px;padding:10px 12px;border:1px dashed var(--line);border-radius:8px}
.note{color:var(--muted);font-size:12px}
</style>
<div class="wrap" id="root">
  <header class="head">
    <h1>자비스 상황판</h1>
    <p id="headline">데이터를 불러오는 중…</p>
    <div class="meta" id="meta"></div>
    <div class="tiles" id="tiles"></div>
  </header>
  <section><h2>확인이 필요한 일 <span class="n" id="n-attn">0</span></h2><div class="list" id="attn"></div></section>
  <section><h2>세션 <span class="n" id="n-sess">0</span></h2><div class="list" id="sess"></div></section>
  <section><h2>예약 작업 <span class="n" id="n-trig">0</span></h2><div class="list" id="trig"></div></section>
  <section><h2>정리 제안 <span class="n" id="n-clean">0</span></h2><div class="list" id="clean"></div></section>
  <section><h2>자비스 개선 제안 <span class="n" id="n-imp">0</span></h2><div class="list" id="imp"></div></section>
  <p class="note">데이터는 이 페이지가 아니라 Artifact 데이터 저장소(board 컬렉션)에 있고, 정기 브리핑이 갱신한다. 제안은 보기만 하며, 실행은 사용자 승인 후 총괄 세션이 한다.</p>
</div>
<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var STATUS={working:['진행 중','info'],blocked:['막힘','bad'],failed:['실패','bad'],review_ready:['검토 대기','warn'],completed:['완료','ok'],idle:['대기','']};
  var SEV={bad:'bad',warn:'warn',info:'info',ok:'ok'};
  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
  function when(s){if(!s)return '';var d=new Date(s);if(isNaN(d))return String(s);
    var m=Math.round((Date.now()-d.getTime())/60000);
    var rel=m<1?'방금':m<60?m+'분 전':m<1440?Math.round(m/60)+'시간 전':Math.round(m/1440)+'일 전';
    return rel+' · '+d.toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}
  function fill(id,nid,items,build,emptyText){
    var box=$(id);box.replaceChildren();
    items=Array.isArray(items)?items:[];
    $(nid).textContent=items.length;
    if(!items.length){box.appendChild(el('div','empty',emptyText));return}
    items.forEach(function(it){box.appendChild(build(it))});
  }
  function card(sev,title,pill,pillSev,desc,subs){
    var c=el('div','item'+(sev?' s-'+sev:''));
    var r=el('div','row');r.appendChild(el('div','t',title));
    if(pill)r.appendChild(el('span','pill '+(pillSev||''),pill));
    c.appendChild(r);
    if(desc)c.appendChild(el('div','d',desc));
    var sub=(subs||[]).filter(Boolean);
    if(sub.length){var s=el('div','sub');sub.forEach(function(x){s.appendChild(el('span',null,x))});c.appendChild(s)}
    return c}
  var D={};
  function render(){
    var s=D.summary||{};
    $('headline').textContent=s.headline||'아직 브리핑 데이터가 없습니다. 정기 브리핑이 한 번 실행되면 채워집니다.';
    var us=s.usage||{};
    $('meta').textContent=(s.updatedAt?'마지막 브리핑 '+when(s.updatedAt):'브리핑 기록 없음')+(us.status?' · 사용량 '+us.status+(us.note?' ('+us.note+')':''):'');
    var c=s.counts||{},tiles=$('tiles');tiles.replaceChildren();
    [['working','진행 중'],['review_ready','검토 대기'],['blocked','막힘'],['failed','실패'],['completed','완료'],['idle','대기']].forEach(function(p){
      if(c[p[0]]==null)return;var t=el('div','tile');t.appendChild(el('b',null,c[p[0]]));t.appendChild(el('span',null,p[1]));tiles.appendChild(t)});
    var attn=(D.attention&&D.attention.items||[]).slice(),dec=(D.decisions&&D.decisions.items||[]).map(function(x){return{kind:'decision',severity:'warn',title:x.question||x.title,detail:x.note||x.detail,ref:x.id}});
    fill('attn','n-attn',attn.concat(dec),function(a){
      var lab={failed:'실패',blocked:'막힘',review:'검토 대기',usage:'사용량',decision:'결정 대기'}[a.kind]||a.kind||'';
      return card(SEV[a.severity]||'warn',a.title||'(제목 없음)',lab,SEV[a.severity]||'warn',a.detail,[a.sessionId||a.ref])},'지금 확인할 일이 없습니다.');
    fill('sess','n-sess',D.sessions&&D.sessions.items,function(x){
      var st=STATUS[x.status]||[x.status||'?',''];
      return card(st[1],x.title||x.id,st[0],st[1],x.summary,[x.repo,x.lastActive?'활동 '+when(x.lastActive):'',x.id])},'세션 정보가 없습니다.');
    fill('trig','n-trig',D.triggers&&D.triggers.items,function(x){
      return card(x.enabled?'ok':'',x.name||x.id,x.enabled?'켜짐':'꺼짐',x.enabled?'ok':'',x.detail,[x.schedule,x.nextRun?'다음 '+when(x.nextRun):'',x.lastStatus?'최근 '+x.lastStatus:'',x.id])},'예약 작업이 없습니다.');
    fill('clean','n-clean',D.cleanup&&D.cleanup.items,function(x){
      return card('info',x.target||x.title,x.kind||'제안','info',x.reason,[x.id])},'정리할 것이 없습니다.');
    fill('imp','n-imp',D.improvements&&D.improvements.items,function(x){
      return card('info',x.title,x.status||'제안','info',x.detail,[])},'개선 제안이 아직 없습니다.');
  }
  function start(db){
    db.collection('board').onSnapshot(function(snap){
      D={};snap.docs.forEach(function(d){D[d.id]=d.data()});render()
    },function(e){$('headline').textContent='데이터를 읽지 못했습니다 ('+(e&&e.code||'오류')+').'});
  }
  render();
  if(window.claude&&claude.use){claude.use('db').then(function(db){
    if(!db){$('headline').textContent='데이터 저장소에 연결할 수 없습니다(로그인이 필요할 수 있습니다).';return}
    start(db)}).catch(function(){})}
})();
</script>
