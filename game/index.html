<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>마을 걷기 시험</title>
    <style>
      :root { --ink: #efe7d8; --panel: rgba(18, 14, 12, 0.66); --edge: rgba(239, 231, 216, 0.25); --accent: #c9773f; color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #1a1714; color: var(--ink); overflow: hidden;
        font-family: system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
      #app { position: fixed; inset: 0; touch-action: none; }
      .panel { position: fixed; background: var(--panel); border: 1px solid var(--edge); border-radius: 6px; padding: 8px 12px; font-size: 13px; line-height: 1.55; }
      #hud { top: calc(10px + env(safe-area-inset-top, 0px)); left: calc(10px + env(safe-area-inset-left, 0px)); pointer-events: none; font-variant-numeric: tabular-nums; }
      #title { font-weight: 600; }
      #btns { top: calc(10px + env(safe-area-inset-top, 0px)); right: calc(10px + env(safe-area-inset-right, 0px)); display: flex; gap: 6px; padding: 6px; }
      #btns button { font: inherit; color: var(--ink); background: transparent; border: 1px solid var(--edge); border-radius: 4px; padding: 6px 10px; cursor: pointer; }
      #btns button:hover, #btns button:focus-visible { border-color: var(--accent); outline: none; }
      #acts { position: fixed; right: calc(14px + env(safe-area-inset-right, 0px)); bottom: calc(80px + env(safe-area-inset-bottom, 0px));
        display: grid; grid-template-columns: repeat(3, 64px); gap: 8px; }
      #acts button { font: inherit; font-size: 13px; color: var(--ink); background: var(--panel); border: 1px solid var(--edge);
        border-radius: 50%; width: 64px; height: 64px; touch-action: manipulation; user-select: none; -webkit-user-select: none; cursor: pointer; }
      #acts button:active { border-color: var(--accent); background: rgba(201, 119, 63, 0.35); }
      #acts .big { grid-column: 2 / span 2; width: auto; border-radius: 32px; }
      #helpbox { bottom: calc(10px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); max-width: calc(100% - 40px); text-align: center; pointer-events: none; opacity: .9; }
      #toast { top: 30%; left: 50%; transform: translateX(-50%); border-color: var(--accent); }
      #perf { opacity: .8; font-size: 12px; }
      #bench-progress { color: var(--accent); }
      #bench { top: 50%; left: 50%; transform: translate(-50%, -50%); max-width: calc(100% - 40px); border-color: var(--accent); }
      #bench-title { font-weight: 600; padding-right: 28px; }
      #bench pre { font: 12px/1.6 ui-monospace, monospace; margin: 8px 0; white-space: pre-wrap; }
      #bench-note { font-size: 12px; opacity: .8; }
      #bench-close { position: absolute; top: 4px; right: 6px; font: inherit; color: var(--ink); background: transparent; border: 0; font-size: 18px; cursor: pointer; }
      #btns { flex-wrap: wrap; max-width: calc(100% - 20px); justify-content: flex-end; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud" class="panel"><div id="title"></div><div id="camera"></div><div id="fps">-</div><div id="perf"></div><div id="bench-progress" hidden></div></div>
    <div id="btns" class="panel"><button id="btn-camera"></button><button id="btn-save"></button><button id="btn-load"></button><button id="btn-sound"></button><button id="btn-quality"></button><button id="btn-bench"></button></div>
    <div id="acts"><button id="btn-cut1"></button><button id="btn-cut2"></button><button id="btn-cut3"></button><button id="btn-sword"></button><button id="btn-jump" class="big"></button></div>
    <div id="helpbox" class="panel"><div id="help"></div><div id="help-touch"></div></div>
    <div id="toast" class="panel" hidden></div>
    <div id="bench" class="panel" hidden><div id="bench-title"></div><pre id="bench-rows"></pre><div id="bench-note"></div><button id="bench-close">×</button></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
