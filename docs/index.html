<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>파이브릿지</title>
  <meta name="description" content="아이패드에서 바로 쓰는 파이썬 코딩 앱">
  <meta name="theme-color" content="#2b5b84">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="파이브릿지">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Nanum+Gothic+Coding:wght@400;700&display=swap">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <button class="icon-btn" id="btn-drawer" type="button" aria-label="내 코드 목록 열기" aria-expanded="false" aria-controls="drawer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      </button>
      <div class="brand" aria-label="파이브릿지">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8"/><path d="M5 22c4-9 18-9 22 0"/><path d="M9 22v-4M16 22v-6.5M23 22v-4"/></svg>
        <span class="brand-name">파이브릿지</span>
      </div>
      <button class="file-name" id="btn-rename" type="button" aria-label="코드 이름 바꾸기">
        <span id="file-name-text">첫 만남</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>
      </button>
      <span class="save-state" id="save-state">이 기기에 저장돼요</span>
      <div class="topbar-right">
        <span class="engine-chip" id="engine-chip" data-state="loading" role="status"><i aria-hidden="true"></i><span id="engine-text">파이썬 준비 중</span></span>
        <div class="font-size" role="group" aria-label="글자 크기">
          <button type="button" id="btn-font-down" aria-label="글자 작게">가<small>−</small></button>
          <button type="button" id="btn-font-up" aria-label="글자 크게">가<small>+</small></button>
        </div>
        <button class="btn btn-stop" id="btn-stop" type="button" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>멈춤
        </button>
        <button class="btn btn-run" id="btn-run" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>실행
        </button>
      </div>
    </header>

    <main class="workspace">
      <section class="pane pane-editor" aria-label="코드 편집">
        <div id="editor"></div>
        <div class="keybar" id="keybar" role="toolbar" aria-label="기호와 단어 입력"></div>
      </section>

      <section class="pane pane-output" aria-label="실행">
        <div class="tabs" role="tablist">
          <button type="button" role="tab" id="tab-console" aria-selected="true" aria-controls="console">실행 결과</button>
          <button type="button" role="tab" id="tab-vars" aria-selected="false" aria-controls="vars">변수 <span class="count" id="vars-count">0</span></button>
        </div>
        <div class="console" id="console" role="log" aria-live="polite" tabindex="0">
          <div class="welcome">
            <p class="welcome-title">실행 결과가 여기에 나와요</p>
            <ul>
              <li>오른쪽 위 <b>실행</b>을 누르거나 키보드에서 <kbd>⌘</kbd><kbd>Enter</kbd></li>
              <li><code>input()</code>이 나오면 아래 칸에 답을 적어서 보내요</li>
              <li>오류가 나면 무엇이 잘못됐는지 한국어로 알려 줘요</li>
            </ul>
          </div>
        </div>
        <div class="vars" id="vars" role="tabpanel" aria-labelledby="tab-vars" hidden>
          <p class="vars-empty">코드를 실행하면 만들어진 변수가 여기에 나와요.</p>
        </div>
        <form class="answer" id="answer-form" hidden>
          <label for="answer-input" id="answer-label">프로그램이 답을 기다려요</label>
          <div class="answer-row">
            <input id="answer-input" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send">
            <button type="submit" class="btn btn-send">보내기</button>
          </div>
        </form>
      </section>
    </main>

    <div class="scrim" id="scrim" hidden></div>
    <aside class="drawer" id="drawer" aria-label="내 코드" inert>
      <div class="drawer-head">
        <h2>내 코드</h2>
        <button class="icon-btn" id="btn-drawer-close" type="button" aria-label="닫기">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="drawer-actions">
        <button class="btn btn-primary" id="btn-new" type="button">새 코드</button>
        <label class="btn btn-ghost" for="file-import">파일 가져오기</label>
        <input type="file" id="file-import" accept=".py,.txt,text/x-python,text/plain" hidden>
      </div>
      <ul class="file-list" id="file-list"></ul>
      <h3 class="drawer-sub">예제로 시작하기</h3>
      <ul class="example-list" id="example-list"></ul>
      <div class="drawer-foot">
        <p class="drawer-foot-title">지금 열린 코드</p>
        <div class="drawer-foot-row">
          <button class="btn btn-ghost" id="btn-copy" type="button">코드 복사</button>
          <button class="btn btn-ghost" id="btn-export" type="button">.py 파일로 저장</button>
          <button class="btn btn-ghost btn-danger" id="btn-delete" type="button">삭제</button>
        </div>
      </div>
    </aside>

    <div class="modal" id="modal" hidden>
      <form class="modal-card" id="modal-form" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <h2 id="modal-title"></h2>
        <p id="modal-message"></p>
        <input id="modal-input" type="text" autocomplete="off" autocorrect="off" spellcheck="false" hidden>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="modal-cancel">취소</button>
          <button type="submit" class="btn btn-primary" id="modal-ok">확인</button>
        </div>
      </form>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
</body>
</html>
